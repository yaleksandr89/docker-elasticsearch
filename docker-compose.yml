name: ${COMPOSE_PROJECT_NAME:?required}
services:
  elasticsearch:
    container_name: ${ELASTIC_CONTAINER:?required}
    build:
      context: ./docker-configs/elasticsearch
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION:?required}
    environment:
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms2048m -Xmx2048m'
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--max-time", "4", "--output", "/dev/null", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 5s
      timeout: 5s
      retries: 48
    volumes:
      - type: bind
        source: ${ELASTIC_DATA_DIR:?required}
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: false
    networks:
      - backend

  kibana:
    container_name: ${KIBANA_CONTAINER:?required}
    build:
      context: ./docker-configs/kibana
      args:
        KIBANA_VERSION: ${KIBANA_VERSION:?required}
    environment:
      - 'ELASTICSEARCH_HOSTS=["http://elasticsearch:${ELASTIC_PORT:?required}"]'
      - SERVER_NAME=${KIBANA_DOMAIN:?required}
      - SERVER_PUBLICBASEURL=http://${KIBANA_DOMAIN:?required}:${NGINX_PORT:?required}
    volumes:
      - type: bind
        source: ${KIBANA_DATA_DIR:?required}
        target: /usr/share/kibana/data
        bind:
          create_host_path: false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  nginx:
    container_name: ${NGINX_CONTAINER:?required}
    build:
      context: ./docker-configs/nginx
      args:
        NGINX_VERSION: ${NGINX_VERSION:?required}
    environment:
      - ELASTIC_PORT=${ELASTIC_PORT:?required}
      - KIBANA_PORT=${KIBANA_PORT:?required}
      - ELASTIC_DOMAIN=${ELASTIC_DOMAIN:?required}
      - KIBANA_DOMAIN=${KIBANA_DOMAIN:?required}
    ports:
      - target: 80
        published: "${NGINX_PORT:?required}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      - kibana
    networks:
      - backend

networks:
  backend:
    driver: bridge
