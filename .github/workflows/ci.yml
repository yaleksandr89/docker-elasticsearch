name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Make, proxy rules, fixtures and both Compose models
        run: |
          bash -n docker-configs/nginx/start-nginx.sh
          python3 tests/check-fixtures.py
          python3 tests/test-runtime-contract.py

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_CONTEXT: default
      COMPOSE_PROJECT_NAME: elastic-learning-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare a fresh project on this disposable runner
        run: |
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          directory="$RUNNER_TEMP/$COMPOSE_PROJECT_NAME"
          mkdir "$directory"
          git archive HEAD | tar -x -C "$directory"
          cd "$directory"
          port=$(python3 -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          sed -e "s/docker-elasticsearch/$COMPOSE_PROJECT_NAME/g" -e "s/^NGINX_PORT=.*/NGINX_PORT=$port/" .docker.env.example > .docker.env
          echo "NGINX_PORT=$port" >> "$GITHUB_ENV"
          echo "LAB_DIR=$directory" >> "$GITHUB_ENV"
          make init
          make config
          docker compose --env-file .docker.env -f docker-compose.yml config --format json > model.json
          NGINX_PORT="$port" python3 tests/check-fixtures.py model.json
          ids=$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")
          test -z "$ids"
          for suffix in es kibana nginx; do
              ids=$(docker ps -aq --filter "name=^/${COMPOSE_PROJECT_NAME}-$suffix$")
              test -z "$ids"
          done
          ids=$(docker network ls -q --filter "name=^${COMPOSE_PROJECT_NAME}_backend$")
          test -z "$ids"
          # Fresh runner only. Prepare the two empty bind roots for the official image users.
          sudo install -d -o 1000 -g 0 -m 0770 data/elasticsearch
          sudo install -d -o 1000 -g 1000 -m 0770 data/kibana
          sudo sysctl -w vm.max_map_count=1048576
      - name: Build images and start the disposable lab
        run: |
          cd "$LAB_DIR"
          make build
          for service in elasticsearch kibana; do
              uid=$(docker run --rm --network none --read-only --entrypoint id "$COMPOSE_PROJECT_NAME-$service" -u)
              test "$uid" = 1000
          done
          echo 'LAB_STARTED=1' >> "$GITHUB_ENV"
          make up
      - name: Verify search, analysis and persistence
        run: |
          cd "$LAB_DIR"
          python3 tests/smoke.py
          docker exec "$COMPOSE_PROJECT_NAME-kibana" sh -ec 'set -C; echo persistent > /usr/share/kibana/data/lab-sentinel'
          make reset
          python3 tests/smoke.py --persisted
          value=$(docker exec "$COMPOSE_PROJECT_NAME-kibana" cat /usr/share/kibana/data/lab-sentinel)
          test "$value" = persistent
      - name: Show service state
        if: failure() && env.LAB_STARTED == '1'
        run: |
          cd "$LAB_DIR"
          docker compose --env-file .docker.env -f docker-compose.yml ps -a
      - name: Stop the disposable lab
        if: always() && env.LAB_STARTED == '1'
        run: |
          cd "$LAB_DIR"
          make down
